<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="240" rx="36" fill="url(#bg)" stroke="rgba(249, 115, 22, 0.3)" stroke-width="4" />
  
  <!-- Emblem Icon -->
  <g transform="translate(30, 20)">
    <rect width="200" height="200" rx="48" fill="rgba(249, 115, 22, 0.12)" border="rgba(249, 115, 22, 0.3)" />
    <path d="M 40 140 L 70 100 L 100 130 L 140 60 L 165 90 L 180 70" fill="none" stroke="url(#primary-glow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <rect x="65" y="80" width="12" height="45" rx="3" fill="url(#primary-glow)" />
    <rect x="134" y="50" width="12" height="55" rx="3" fill="url(#primary-glow)" />
    <circle cx="180" cy="70" r="8" fill="#F59E0B" filter="url(#glow)" />
  </g>

  <!-- Branding Text -->
  <text x="260" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="68" fill="#FFFFFF" letter-spacing="-1">
    Au Pluriel
  </text>
  <text x="265" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="url(#primary-glow)" letter-spacing="8">
    QUANT TRADING
  </text>
</svg>
